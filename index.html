<!doctype html>
<html lang="ko">
    <head>
        <meta charset="utf-8">
        <meta name="referrer" content="strict-origin-when-cross-origin">
        <meta name="viewport" content="width=device-width,initial-scale=1">
        <title>Cozy Pomodoro</title>
        <style>
            :root {
                --white: rgba(255,255,255,.94);
                --glass: rgba(20,25,20,.30)
            }

            * {
                box-sizing: border-box
            }

            html,body {
                width: 100%;
                height: 100%;
                margin: 0;
                overflow: hidden;
                font-family: Arial,"Noto Sans KR",sans-serif
            }

            body {
                background: #222;
                color: white
            }

            #bg {
                position: fixed;
                inset: 0;
                width: 100%;
                height: 100%;
                object-fit: cover;
                z-index: -3;
                transition: opacity .6s
            }

            #shade {
                position: fixed;
                inset: 0;
                background: rgba(0,0,0,.16);
                z-index: -2
            }

            .wrap {
                height: 100%;
                display: flex;
                align-items: center;
                justify-content: center
            }

            .timerBox {
                text-align: center;
                display: flex;
                flex-direction: column;
                align-items: center
            }

            .ring {
                width: min(52vh,430px);
                height: min(52vh,430px);
                position: relative;
                display: grid;
                place-items: center
            }

            svg {
                position: absolute;
                inset: 0;
                width: 100%;
                height: 100%;
                transform: rotate(-90deg)
            }

            .track {
                fill: none;
                stroke: rgba(255,255,255,.32);
                stroke-width: 5
            }

            .progress {
                fill: none;
                stroke: white;
                stroke-width: 5;
                stroke-linecap: round;
                transition: stroke-dashoffset .25s linear
            }

            .time {
                font-size: clamp(58px,9vw,104px);
                font-weight: 700;
                letter-spacing: 2px;
                text-shadow: 0 2px 12px rgba(0,0,0,.28)
            }

            .mode {
                margin-top: 10px;
                font-size: 15px;
                letter-spacing: 4px;
                font-weight: 700;
                text-shadow: 0 2px 8px rgba(0,0,0,.35)
            }

            .controls {
                margin-top: 24px;
                display: flex;
                gap: 9px;
                flex-wrap: wrap;
                justify-content: center
            }

            button {
                border: 1px solid rgba(255,255,255,.55);
                background: rgba(255,255,255,.18);
                backdrop-filter: blur(8px);
                color: white;
                border-radius: 999px;
                padding: 10px 17px;
                font-size: 14px;
                cursor: pointer
            }

            button:hover {
                background: rgba(255,255,255,.30)
            }

            .panel {
                position: fixed;
                right: 18px;
                bottom: 18px;
                width: min(360px,calc(100vw - 36px));
                padding: 14px 15px;
                border-radius: 16px;
                background: var(--glass);
                backdrop-filter: blur(12px);
                border: 1px solid rgba(255,255,255,.22);
                font-size: 12px
            }

            .panel summary {
                cursor: pointer;
                font-size: 13px;
                font-weight: 700
            }

            label {
                display: block;
                margin-top: 11px;
                margin-bottom: 5px
            }

            input[type=text] {
                width: 100%;
                padding: 9px 10px;
                border-radius: 9px;
                border: 1px solid rgba(255,255,255,.35);
                background: rgba(0,0,0,.22);
                color: white;
                outline: none
            }

            input[type=file] {
                width: 100%;
                font-size: 12px
            }

            .row {
                display: flex;
                gap: 8px;
                align-items: center;
                margin-top: 10px
            }

            .row button {
                padding: 7px 12px
            }

            .hint {
                opacity: .8;
                line-height: 1.5;
                margin-top: 9px
            }

            .badge {
                position: fixed;
                top: 18px;
                left: 18px;
                padding: 7px 11px;
                border-radius: 999px;
                background: rgba(0,0,0,.25);
                backdrop-filter: blur(8px);
                font-size: 12px
            }

            #toast {
                position: fixed;
                top: 18px;
                left: 50%;
                transform: translateX(-50%) translateY(-20px);
                opacity: 0;
                transition: .35s;
                padding: 10px 16px;
                border-radius: 999px;
                background: rgba(0,0,0,.55);
                backdrop-filter: blur(10px);
                font-size: 13px;
                pointer-events: none
            }

            #toast.show {
                opacity: 1;
                transform: translateX(-50%) translateY(0)
            }
        </style>
    </head>
    <body>
        <img id="bg" alt="">
        <div id="shade"></div>
        <div class="badge" id="session">ROUND 1</div>
        <div id="toast"></div>
        <div class="wrap">
            <div class="timerBox">
                <div class="ring">
                    <svg viewBox="0 0 200 200" aria-hidden="true">
                        <circle class="track" cx="100" cy="100" r="92"></circle>
                        <circle class="progress" id="progress" cx="100" cy="100" r="92"></circle>
                    </svg>
                    <div>
                        <div class="time" id="time">25:00</div>
                        <div class="mode" id="mode">FOCUS</div>
                    </div>
                </div>
                <div class="controls">
                    <button id="start">▶ 시작</button>
                    <button id="pause">Ⅱ 일시정지</button>
                    <button id="skip">다음 단계 →</button>
                    <button id="reset">↻ 처음부터</button>
                </div>
            </div>
        </div>
        <details class="panel">
            <summary>⚙ 설정</summary>
            <label>배경 이미지 추가 (추가한 이미지는 랜덤 후보에 포함)</label>
            <input id="files" type="file" accept="image/*" multiple>
            <div class="row">
                <button id="shuffle">🎲 지금 배경 바꾸기</button>
                <button id="fullscreen">⛶ 전체화면</button>
            </div>
            <div class="hint">
                시작 버튼을 누르면 알림음이 재생됩니다.
                집중/휴식의 시작과 종료마다 서로 다른 알림음이 나옵니다.
            </div>
        </details>
        <script>
            const BUILTIN = [
                "backgrounds/bg1.jpg",
                "backgrounds/bg2.jpg",
                "backgrounds/bg3.jpg"
            ];
            let backgrounds = [...BUILTIN];
            let currentBg = -1;
            let extraImages = JSON.parse(localStorage.getItem("pom_extra_images") || "[]");
            backgrounds.push(...extraImages);

            const bg = document.getElementById("bg");
            const timeEl = document.getElementById("time");
            const modeEl = document.getElementById("mode");
            const progress = document.getElementById("progress");
            const sessionEl = document.getElementById("session");
            const toast = document.getElementById("toast");

            const R = 92
              , C = 2 * Math.PI * R;
            progress.style.strokeDasharray = `0 ${C}`;
            progress.style.strokeDashoffset = 0;

            let phase = "focus";
            let duration = 25 * 60;
            let remaining = duration;
            let running = false;
            let lastTick = null;
            let round = 1;
            let timerId = null;
            let audioCtx = null;

            function pickBackground() {
                if (backgrounds.length === 0)
                    return;
                let next;
                do {
                    next = Math.floor(Math.random() * backgrounds.length);
                } while (backgrounds.length > 1 && next === currentBg);
                currentBg = next;
                bg.style.opacity = 0;
                setTimeout( () => {
                    bg.src = backgrounds[currentBg];
                    bg.style.opacity = 1;
                }
                , 180);
            }
            pickBackground();

            function format(sec) {
                sec = Math.max(0, Math.ceil(sec));
                return String(Math.floor(sec / 60)).padStart(2, "0") + ":" + String(sec % 60).padStart(2, "0");
            }
            function render() {
                timeEl.textContent = format(remaining);
                modeEl.textContent = phase === "focus" ? "집중" : "휴식";
                sessionEl.textContent = `ROUND ${round}`;
                const ratio = Math.max(0, Math.min(1, (duration - remaining) / duration));
                // 12시에서 시작해 시계 방향으로 진행합니다. 시간이 줄수록 진행선이 오른쪽(3시 방향)부터 줄어듭니다.
                progress.style.strokeDasharray = `${C * ratio} ${C}`;
                progress.style.strokeDashoffset = 0;
                document.title = `${format(remaining)} · ${phase === "focus" ? "집중" : "휴식"}`;
            }
            function showToast(msg) {
                toast.textContent = msg;
                toast.classList.add("show");
                clearTimeout(showToast.t);
                showToast.t = setTimeout( () => toast.classList.remove("show"), 2200);
            }

            const sounds = {
                focusStart: new Audio("sounds/focus-start.wav"),
                focusEnd: new Audio("sounds/focus-end.wav"),
                breakStart: new Audio("sounds/break-start.wav"),
                breakEnd: new Audio("sounds/break-end.wav"),
                pause: new Audio("sounds/pause.wav")
            };
            Object.values(sounds).forEach(audio => {
                audio.preload = "auto";
                audio.volume = 1.0;
            });

            function beep(kind) {
                try {
                    const audio = sounds[kind] || sounds.focusStart;
                    audio.currentTime = 0;
                    const p = audio.play();
                    if (p) p.catch(e => console.warn("알림음 재생 실패:", e));
                } catch (e) {
                    console.warn("알림음 재생 실패:", e);
                }
            }

            function start() {
                if (running) return;

                // 버튼을 직접 누른 순간 AudioContext를 활성화해 시작 알림음이 확실히 나도록 합니다.
                try {
                    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
                    if (audioCtx.state === "suspended") audioCtx.resume();
                } catch (e) {}

                running = true;
                lastTick = performance.now();
                beep(phase === "focus" ? "focusStart" : "breakStart");
                showToast(phase === "focus" ? "집중 시작 🍅" : "휴식 시작 ☕");
                timerId = requestAnimationFrame(tick);
            }

            function tick(now) {
                if (!running) return;
                const delta = (now - lastTick) / 1000;
                lastTick = now;
                remaining -= delta;
                if (remaining <= 0) {
                    remaining = 0;
                    render();
                    transition();
                    return;
                }
                render();
                timerId = requestAnimationFrame(tick);
            }

            function pause() {
                if (!running) return;
                running = false;
                cancelAnimationFrame(timerId);
                beep("pause");
                showToast("일시정지");
            }

            function transition() {
                running = false;
                cancelAnimationFrame(timerId);

                if (phase === "focus") {
                    // 25분 집중 종료 + 5분 휴식 시작
                    beep("focusEnd");
                    phase = "break";
                    duration = 5 * 60;
                    remaining = duration;
                    showToast("집중 끝! 5분 휴식 🌿");
                } else {
                    // 5분 휴식 종료 + 25분 집중 시작
                    beep("breakEnd");
                    phase = "focus";
                    duration = 25 * 60;
                    remaining = duration;
                    round++;
                    pickBackground();
                    showToast("휴식 끝! 다시 집중 🍅");
                }

                render();

                // 집중 → 휴식 → 다음 라운드 집중을 자동으로 이어갑니다.
                // 사용자가 처음 시작 버튼을 누른 뒤에는 각 단계 전환마다 자동 시작됩니다.
                start();
            }

            function skip() {
                transition();
            }

            function reset() {
                running = false;
                cancelAnimationFrame(timerId);
                phase = "focus";
                duration = 25 * 60;
                remaining = duration;
                round = 1;
                pickBackground();
                render();
                showToast("처음부터 시작");
            }
            document.getElementById("start").onclick = start;
            document.getElementById("pause").onclick = pause;
            document.getElementById("skip").onclick = skip;
            document.getElementById("reset").onclick = reset;
            document.getElementById("shuffle").onclick = pickBackground;
            document.getElementById("fullscreen").onclick = () => {
                if (!document.fullscreenElement)
                    document.documentElement.requestFullscreen?.();
                else
                    document.exitFullscreen?.();
            }
            ;

            document.getElementById("files").addEventListener("change", async e => {
                const files = [...e.target.files];
                const urls = [];
                for (const f of files) {
                    urls.push(await new Promise( (res) => {
                        const r = new FileReader();
                        r.onload = () => res(r.result);
                        r.readAsDataURL(f);
                    }
                    ));
                }
                extraImages = extraImages.concat(urls);
                localStorage.setItem("pom_extra_images", JSON.stringify(extraImages));
                backgrounds = [...BUILTIN, ...extraImages];
                pickBackground();
                showToast(`${files.length}개 배경 추가됨`);
            }
            );

            render();
        </script>
    </body>
</html>
