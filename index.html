<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />

    <title>Cozy Pomodoro</title>

    <style>
      :root {
        --white: rgba(255, 255, 255, 0.94);
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        font-family: Arial, "Noto Sans KR", sans-serif;
      }

      body {
        background: #222;
        color: white;
      }

      /* =========================
   BACKGROUND
========================= */

      #bg {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        z-index: -3;
        transition: opacity 0.6s;
      }

      #shade {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.16);
        z-index: -2;
      }

      /* =========================
   MAIN
========================= */

      .wrap {
        width: 100%;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
      }

      .timerBox {
        width: 100%;
        text-align: center;

        display: flex;
        flex-direction: column;
        align-items: center;
      }

      /* =========================
   TIMER RING
========================= */

      .ring {
        width: min(52vh, 430px);
        height: min(52vh, 430px);

        position: relative;

        display: grid;
        place-items: center;
      }

      svg {
        position: absolute;
        inset: 0;

        width: 100%;
        height: 100%;

        transform: rotate(-90deg);
      }

      .track {
        fill: none;
        stroke: rgba(255, 255, 255, 0.32);
        stroke-width: 5;
      }

      .progress {
        fill: none;
        stroke: white;
        stroke-width: 5;
        stroke-linecap: round;

        transition: stroke-dasharray 0.25s linear;
      }

      /* =========================
   TIME
========================= */

      .time {
        font-size: clamp(58px, 9vw, 104px);
        font-weight: 700;
        letter-spacing: 2px;

        text-shadow: 0 2px 12px rgba(0, 0, 0, 0.28);

        white-space: nowrap;
      }

      .mode {
        margin-top: 10px;

        font-size: 15px;
        letter-spacing: 4px;
        font-weight: 700;

        text-shadow: 0 2px 8px rgba(0, 0, 0, 0.35);
      }

      /* =========================
   BUTTONS
========================= */

      .controls {
        width: 100%;

        margin-top: 24px;

        display: flex;
        flex-direction: row;
        flex-wrap: wrap;

        gap: 9px;

        justify-content: center;
        align-items: center;

        max-width: 100%;
      }

      button {
        border: 1px solid rgba(255, 255, 255, 0.55);

        background: rgba(255, 255, 255, 0.18);

        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);

        color: white;

        border-radius: 999px;

        padding: 10px 17px;

        font-size: 14px;

        cursor: pointer;

        white-space: nowrap;

        -webkit-tap-highlight-color: transparent;

        transition:
          background 0.15s,
          transform 0.1s;
      }

      button:hover {
        background: rgba(255, 255, 255, 0.3);
      }

      button:active {
        background: rgba(255, 255, 255, 0.36);
        transform: scale(0.97);
      }

      /* =========================
   ROUND BADGE
========================= */

      .badge {
        position: fixed;

        top: 18px;
        left: 18px;

        padding: 7px 11px;

        border-radius: 999px;

        background: rgba(0, 0, 0, 0.25);

        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);

        font-size: 12px;
      }

      /* =========================
   TOAST
========================= */

      #toast {
        position: fixed;

        top: 18px;
        left: 50%;

        transform: translateX(-50%) translateY(-20px);

        opacity: 0;

        transition: 0.35s;

        padding: 10px 16px;

        border-radius: 999px;

        background: rgba(0, 0, 0, 0.55);

        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);

        font-size: 13px;

        pointer-events: none;

        white-space: nowrap;

        z-index: 10;
      }

      #toast.show {
        opacity: 1;

        transform: translateX(-50%) translateY(0);
      }

      /* =========================================================
   MOBILE
========================================================= */

      @media (max-width: 600px) {
        .wrap {
          padding: max(16px, env(safe-area-inset-top))
            max(16px, env(safe-area-inset-right))
            max(16px, env(safe-area-inset-bottom))
            max(16px, env(safe-area-inset-left));
        }

        .timerBox {
          width: 100%;
        }

        /* 원형 타이머 크기 */

        .ring {
          width: min(66vw, 290px);
          height: min(66vw, 290px);
        }

        /* 시간 */

        .time {
          font-size: clamp(48px, 14vw, 72px);
          letter-spacing: 1px;
        }

        .mode {
          margin-top: 5px;

          font-size: 12px;
          letter-spacing: 3px;
        }

        /* 버튼
     기본은 가로 배치.
     화면이 부족하면 자동 줄바꿈.
  */

        .controls {
          width: 100%;

          margin-top: 10px;
          padding: 0;

          display: flex;

          flex-direction: row;
          flex-wrap: wrap;

          justify-content: center;
          align-items: center;

          gap: 6px;
        }

        button {
          width: auto;

          min-height: 34px;

          padding: 7px 14px;

          font-size: 12px;

          line-height: 1.2;
        }

        /* ROUND 표시 */

        .badge {
          top: max(10px, env(safe-area-inset-top));
          left: max(10px, env(safe-area-inset-left));

          padding: 6px 9px;

          font-size: 11px;
        }

        /* Toast */

        #toast {
          top: max(10px, env(safe-area-inset-top));

          max-width: calc(100vw - 32px);

          padding: 8px 13px;

          font-size: 12px;

          overflow: hidden;
          text-overflow: ellipsis;
        }
      }

      /* =========================================================
   VERY SMALL PHONE
========================================================= */

      @media (max-width: 380px) {
        .wrap {
          padding: 12px;
        }

        /* 원형을 조금 더 작게 */

        .ring {
          width: min(60vw, 250px);
          height: min(60vw, 250px);
        }

        .time {
          font-size: clamp(42px, 13vw, 60px);
        }

        .mode {
          margin-top: 4px;

          font-size: 11px;
          letter-spacing: 2.5px;
        }

        /* 버튼은 여전히 가로 우선,
     공간이 없으면 자동으로 다음 줄 */

        .controls {
          margin-top: 7px;
          gap: 5px;
        }

        button {
          width: auto;

          min-height: 32px;

          padding: 6px 12px;

          font-size: 11px;
        }
      }

      /* =========================================================
   MOBILE LANDSCAPE
========================================================= */

      @media (max-width: 900px) and (orientation: landscape) {
        .wrap {
          padding: 10px 16px;
        }

        .timerBox {
          transform: scale(0.72);
        }

        /* 가로 화면에서는 높이 기준으로 원 크기 결정 */

        .ring {
          width: min(58vh, 280px);
          height: min(58vh, 280px);
        }

        /* 버튼도 가로 우선 */

        .controls {
          margin-top: 8px;

          display: flex;

          flex-direction: row;
          flex-wrap: wrap;

          justify-content: center;
          align-items: center;

          gap: 5px;
        }

        button {
          width: auto;

          min-height: 30px;

          padding: 6px 12px;

          font-size: 11px;
        }

        .badge {
          top: 8px;
          left: 8px;
        }

        #toast {
          top: 8px;
        }
      }
    </style>
  </head>

  <body>
    <!-- =========================
     BACKGROUND
========================= -->

    <img id="bg" alt="" />

    <div id="shade"></div>

    <!-- =========================
     ROUND
========================= -->

    <div class="badge" id="session">ROUND 1</div>

    <!-- =========================
     TOAST
========================= -->

    <div id="toast"></div>

    <!-- =========================
     TIMER
========================= -->

    <div class="wrap">
      <div class="timerBox">
        <div class="ring">
          <svg viewBox="0 0 200 200" aria-hidden="true">
            <!-- 전체 원 -->
            <circle class="track" cx="100" cy="100" r="92"></circle>

            <!-- 진행 원 -->
            <circle
              class="progress"
              id="progress"
              cx="100"
              cy="100"
              r="92"
            ></circle>
          </svg>

          <div>
            <div class="time" id="time">25:00</div>

            <div class="mode" id="mode">집중</div>
          </div>
        </div>

        <!-- =========================
         CONTROLS
    ========================= -->

        <div class="controls">
          <button id="start">▶ 시작</button>

          <button id="pause">Ⅱ 일시정지</button>

          <button id="skip">다음 단계 →</button>

          <button id="reset">↻ 처음부터</button>
        </div>
      </div>
    </div>

    <script>
      /* =========================================================
   BACKGROUNDS
========================================================= */

      const BUILTIN = [
        "backgrounds/bg1.jpg",
        "backgrounds/bg2.jpg",
        "backgrounds/bg3.jpg",
      ];

      let backgrounds = [...BUILTIN];
      let currentBg = -1;

      const bg = document.getElementById("bg");

      const timeEl = document.getElementById("time");
      const modeEl = document.getElementById("mode");
      const progress = document.getElementById("progress");
      const sessionEl = document.getElementById("session");
      const toast = document.getElementById("toast");

      /* =========================================================
   CIRCLE
========================================================= */

      const R = 92;

      const C = 2 * Math.PI * R;

      progress.style.strokeDasharray = `0 ${C}`;
      progress.style.strokeDashoffset = 0;

      /* =========================================================
   TIMER STATE
========================================================= */

      let phase = "focus";

      let duration = 25 * 60;

      let remaining = duration;

      let running = false;

      // 실제 종료 시각을 기준으로 시간을 계산합니다.
      // requestAnimationFrame이 백그라운드 탭에서 제한되어도
      // 탭을 다시 열었을 때 실제 경과 시간이 정확히 반영됩니다.
      let endTime = null;

      let lastTick = null;

      let round = 1;

      let timerId = null;

      // 백그라운드 탭에서도 가능한 범위에서 타이머 상태를 확인합니다.
      let backgroundTimerId = null;
      let titleTimerId = null;

      /* =========================================================
   AUDIO
========================================================= */

      let audioCtx = null;

      /* =========================================================
   BACKGROUND PICKER
========================================================= */

      function pickBackground() {
        if (backgrounds.length === 0) {
          return;
        }

        let next;

        do {
          next = Math.floor(Math.random() * backgrounds.length);
        } while (backgrounds.length > 1 && next === currentBg);

        currentBg = next;

        bg.style.opacity = 0;

        setTimeout(() => {
          bg.src = backgrounds[currentBg];

          bg.style.opacity = 1;
        }, 180);
      }

      pickBackground();

      /* =========================================================
   TIME FORMAT
========================================================= */

      function format(sec) {
        sec = Math.max(0, Math.ceil(sec));

        return (
          String(Math.floor(sec / 60)).padStart(2, "0") +
          ":" +
          String(sec % 60).padStart(2, "0")
        );
      }

      /* =========================================================
   RENDER
========================================================= */

      function render() {
        timeEl.textContent = format(remaining);

        modeEl.textContent = phase === "focus" ? "집중" : "휴식";

        sessionEl.textContent = `ROUND ${round}`;

        /*
    진행률

    0%
    ↓
    100%
  */

        const ratio = Math.max(
          0,
          Math.min(1, (duration - remaining) / duration),
        );

        progress.style.strokeDasharray = `${C * ratio} ${C}`;

        progress.style.strokeDashoffset = 0;

        document.title = `${format(remaining)} · ${
          phase === "focus" ? "집중" : "휴식"
        }`;
      }

      /* =========================================================
   TOAST
========================================================= */

      function showToast(msg) {
        toast.textContent = msg;

        toast.classList.add("show");

        clearTimeout(showToast.t);

        showToast.t = setTimeout(() => {
          toast.classList.remove("show");
        }, 2200);
      }

      /* =========================================================
   SOUNDS
========================================================= */

      const sounds = {
        focusStart: new Audio("sounds/focus-start.wav"),

        focusEnd: new Audio("sounds/focus-end.wav"),

        breakStart: new Audio("sounds/break-start.wav"),

        breakEnd: new Audio("sounds/break-end.wav"),

        pause: new Audio("sounds/pause.wav"),
      };

      Object.values(sounds).forEach((audio) => {
        audio.preload = "auto";

        audio.volume = 1.0;
      });

      /* =========================================================
   PLAY SOUND
========================================================= */

      function beep(kind) {
        try {
          const audio = sounds[kind] || sounds.focusStart;

          audio.currentTime = 0;

          const p = audio.play();

          if (p) {
            p.catch((e) => {
              console.warn("알림음 재생 실패:", e);
            });
          }
        } catch (e) {
          console.warn("알림음 재생 실패:", e);
        }
      }

      /* =========================================================
   START
========================================================= */

      function start() {
        if (running) {
          return;
        }

        try {
          audioCtx =
            audioCtx ||
            new (window.AudioContext || window.webkitAudioContext)();

          if (audioCtx.state === "suspended") {
            audioCtx.resume();
          }
        } catch (e) {}

        running = true;

        // 남은 시간을 실제 종료 시각으로 변환합니다.
        endTime = Date.now() + remaining * 1000;

        lastTick = performance.now();

        beep(phase === "focus" ? "focusStart" : "breakStart");

        showToast(phase === "focus" ? "집중 시작 🍅" : "휴식 시작 ☕");

        timerId = requestAnimationFrame(tick);

        // 백그라운드 탭에서 requestAnimationFrame이 멈추더라도
        // 주기적으로 실제 종료 시각을 확인합니다.
        clearInterval(backgroundTimerId);
        backgroundTimerId = setInterval(checkTimer, 250);

        startTitleTimer();
      }

      /* =========================================================
   TICK
========================================================= */

      function tick(now) {
        if (!running) {
          return;
        }

        checkTimer();

        if (!running) {
          return;
        }

        // 화면 갱신은 requestAnimationFrame에 맡기되,
        // 실제 시간은 endTime을 기준으로 계산합니다.
        remaining = Math.max(0, (endTime - Date.now()) / 1000);

        render();

        timerId = requestAnimationFrame(tick);
      }

      /*
       * 실제 타이머 종료 여부를 wall-clock 기준으로 확인합니다.
       * 백그라운드 탭에서는 requestAnimationFrame이 호출되지 않을 수 있으므로
       * 별도의 interval에서도 이 함수를 호출합니다.
       */
      function checkTimer() {
        if (!running || endTime === null) {
          return;
        }

        remaining = Math.max(0, (endTime - Date.now()) / 1000);

        if (remaining <= 0) {
          remaining = 0;
          render();
          transition();
        }
      }

      /* =========================================================
   PAUSE
========================================================= */

      function pause() {
        if (!running) {
          return;
        }

        // 일시정지 순간의 실제 남은 시간을 보존합니다.
        remaining = Math.max(0, (endTime - Date.now()) / 1000);

        running = false;

        cancelAnimationFrame(timerId);
        clearInterval(backgroundTimerId);
        backgroundTimerId = null;
        clearTimeout(titleTimerId);
        titleTimerId = null;
        endTime = null;

        beep("pause");

        render();

        showToast("일시정지");
      }

      /* =========================================================
   TRANSITION
========================================================= */

      function transition() {
        running = false;

        cancelAnimationFrame(timerId);
        clearInterval(backgroundTimerId);
        backgroundTimerId = null;
        clearTimeout(titleTimerId);
        titleTimerId = null;
        endTime = null;

        if (phase === "focus") {
          /*
      집중 종료
    */

          beep("focusEnd");

          phase = "break";

          duration = 5 * 60;

          remaining = duration;

          showToast("집중 끝! 5분 휴식 🌿");
        } else {
          /*
      휴식 종료
    */

          beep("breakEnd");

          phase = "focus";

          duration = 25 * 60;

          remaining = duration;

          round++;

          pickBackground();

          showToast("휴식 끝! 다시 집중 🍅");
        }

        render();
        start();
      }

      /* =========================================================
   SKIP
========================================================= */

      function skip() {
        // 일시정지 버튼과 같은 소리를 냅니다.
        beep("pause");

        transition();
      }

      /* =========================================================
   RESET
========================================================= */

      function reset() {
        // 일시정지 버튼과 같은 소리를 냅니다.
        beep("pause");

        running = false;

        cancelAnimationFrame(timerId);
        clearInterval(backgroundTimerId);
        backgroundTimerId = null;
        clearTimeout(titleTimerId);
        titleTimerId = null;
        endTime = null;

        phase = "focus";

        duration = 25 * 60;

        remaining = duration;

        round = 1;

        pickBackground();

        render();

        showToast("처음부터 시작");
      }

      /* =========================================================
   TAB TITLE TIMER
========================================================= */

      function updateTabTitle() {
        if (!running || endTime === null) {
          return;
        }

        const currentRemaining = Math.max(0, (endTime - Date.now()) / 1000);

        document.title = `${format(currentRemaining)} · ${phase === "focus" ? "집중" : "휴식"}`;

        if (currentRemaining <= 0) {
          checkTimer();
          return;
        }

        const delay = document.visibilityState === "visible" ? 250 : 1000;
        titleTimerId = setTimeout(updateTabTitle, delay);
      }

      function startTitleTimer() {
        clearTimeout(titleTimerId);
        titleTimerId = null;
        updateTabTitle();
      }

      /* =========================================================
   VISIBILITY / BACKGROUND RECOVERY
========================================================= */

      // 다른 탭을 사용하다 돌아왔을 때 즉시 실제 경과 시간을 반영합니다.
      document.addEventListener("visibilitychange", () => {
        if (running) {
          checkTimer();

          if (running) {
            remaining = Math.max(0, (endTime - Date.now()) / 1000);
            render();
            startTitleTimer();
          }
        }
      });

      /* =========================================================
   BUTTON EVENTS
========================================================= */

      document.getElementById("start").onclick = start;

      document.getElementById("pause").onclick = pause;

      document.getElementById("skip").onclick = skip;

      document.getElementById("reset").onclick = reset;

      /* =========================================================
   INITIAL RENDER
========================================================= */

      render();
    </script>
  </body>
</html>
