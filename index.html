<!doctype html>

<html lang="ko">
  <head>
    <meta charset="utf-8" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />

    <meta name="referrer" content="strict-origin-when-cross-origin" />

    <title>Cozy Pomodoro</title>

    <script src="https://www.youtube.com/iframe_api"></script>

    <style>
      /* =========================================================
   BASIC
========================================================= */

      :root {
        --white: rgba(255, 255, 255, 0.94);
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
      }

      body {
        overflow: hidden;

        font-family: Arial, "Noto Sans KR", sans-serif;

        color: white;

        background: #222;
      }

      /* =========================================================
   BACKGROUND
========================================================= */

      #bg {
        position: fixed;

        inset: 0;

        width: 100%;
        height: 100%;

        object-fit: cover;

        z-index: -3;

        opacity: 1;

        transition: opacity 0.6s ease;
      }

      #shade {
        position: fixed;

        inset: 0;

        background: rgba(0, 0, 0, 0.16);

        z-index: -2;
      }

      /* =========================================================
   MAIN LAYOUT
========================================================= */

      .wrap {
        position: relative;

        width: 100%;
        height: 100%;

        min-height: 100dvh;

        display: flex;

        align-items: center;
        justify-content: center;

        padding: max(20px, env(safe-area-inset-top))
          max(20px, env(safe-area-inset-right))
          max(20px, env(safe-area-inset-bottom))
          max(20px, env(safe-area-inset-left));
      }

      .timerBox {
        width: min(92vw, 620px);

        display: flex;

        flex-direction: column;

        align-items: center;

        justify-content: center;

        text-align: center;
      }

      /* =========================================================
   TIMER RING
========================================================= */

      .ring {
        position: relative;

        width: min(62vw, 62vh, 430px);

        aspect-ratio: 1 / 1;

        flex: 0 0 auto;

        display: grid;

        place-items: center;
      }

      .ring svg {
        position: absolute;

        inset: 0;

        width: 100%;
        height: 100%;

        transform: rotate(-90deg);

        overflow: visible;
      }

      .track {
        fill: none;

        stroke: rgba(255, 255, 255, 0.32);

        stroke-width: 5;
      }

      .progress {
        fill: none;

        stroke: white;

        stroke-width: 5;

        stroke-linecap: round;

        transition: stroke-dasharray 0.25s linear;
      }

      /* =========================================================
   TIMER CONTENT
========================================================= */

      .timerContent {
        position: relative;

        z-index: 1;

        width: 82%;

        display: flex;

        flex-direction: column;

        align-items: center;

        justify-content: center;

        overflow: hidden;
      }

      .time {
        max-width: 100%;

        font-size: min(15vw, 15vh, 104px);

        line-height: 0.95;

        font-weight: 700;

        letter-spacing: 1px;

        white-space: nowrap;

        text-shadow: 0 2px 12px rgba(0, 0, 0, 0.28);
      }

      .mode {
        margin-top: clamp(7px, 1vh, 12px);

        font-size: min(2vw, 2vh, 15px);

        line-height: 1;

        letter-spacing: clamp(2px, 0.5vw, 4px);

        font-weight: 700;

        white-space: nowrap;

        text-shadow: 0 2px 8px rgba(0, 0, 0, 0.35);
      }

      /* =========================================================
   MUSIC TITLE
========================================================= */

      .musicInfo {
        width: min(76vw, 360px);

        margin-top: clamp(10px, 2vh, 16px);

        min-height: 20px;

        display: flex;

        align-items: center;

        justify-content: center;

        gap: 6px;

        overflow: hidden;

        color: rgba(255, 255, 255, 0.88);

        font-size: clamp(10px, 1.5vw, 13px);

        line-height: 1.4;

        text-shadow: 0 2px 8px rgba(0, 0, 0, 0.35);
      }

      .musicIcon {
        flex: 0 0 auto;

        font-size: clamp(10px, 1.4vw, 12px);
      }

      #musicTitle {
        min-width: 0;

        overflow: hidden;

        text-overflow: ellipsis;

        white-space: nowrap;
      }

      /* =========================================================
   CONTROLS
========================================================= */

      .controls {
        width: 100%;

        margin-top: clamp(12px, 2.2vh, 24px);

        display: flex;

        flex-wrap: wrap;

        justify-content: center;

        align-items: center;

        gap: clamp(5px, 1vw, 9px);
      }

      button {
        border: 1px solid rgba(255, 255, 255, 0.55);

        background: rgba(255, 255, 255, 0.18);

        backdrop-filter: blur(8px);

        -webkit-backdrop-filter: blur(8px);

        color: white;

        border-radius: 999px;

        padding: clamp(7px, 1.2vw, 10px) clamp(12px, 1.8vw, 17px);

        font-size: clamp(11px, 1.5vw, 14px);

        line-height: 1.2;

        cursor: pointer;

        white-space: nowrap;

        -webkit-tap-highlight-color: transparent;

        transition:
          background 0.15s ease,
          transform 0.1s ease;
      }

      button:hover {
        background: rgba(255, 255, 255, 0.3);
      }

      button:active {
        background: rgba(255, 255, 255, 0.36);

        transform: scale(0.97);
      }

      /* =========================================================
   ROUND BADGE
========================================================= */

      .badge {
        position: fixed;

        top: max(18px, env(safe-area-inset-top));

        left: max(18px, env(safe-area-inset-left));

        padding: 7px 11px;

        border-radius: 999px;

        background: rgba(0, 0, 0, 0.25);

        backdrop-filter: blur(8px);

        -webkit-backdrop-filter: blur(8px);

        font-size: 12px;

        z-index: 5;
      }

      /* =========================================================
   FULLSCREEN BUTTON
========================================================= */

      .fullscreenBtn {
        position: fixed;

        top: max(18px, env(safe-area-inset-top));

        right: max(18px, env(safe-area-inset-right));

        width: 40px;
        height: 40px;

        display: grid;

        place-items: center;

        padding: 0;

        border: 1px solid rgba(255, 255, 255, 0.45);

        border-radius: 50%;

        background: rgba(0, 0, 0, 0.25);

        backdrop-filter: blur(8px);

        -webkit-backdrop-filter: blur(8px);

        color: white;

        font-size: 21px;

        line-height: 1;

        z-index: 20;
      }

      .fullscreenBtn:hover {
        background: rgba(255, 255, 255, 0.25);
      }

      .fullscreenBtn:active {
        transform: scale(0.92);
      }

      /* =========================================================
   YOUTUBE PLAYER
========================================================= */

      #youtubePlayer {
        position: fixed;

        width: 1px;
        height: 1px;

        left: -10px;
        bottom: -10px;

        opacity: 0;

        pointer-events: none;
      }

      /* =========================================================
   TOAST
========================================================= */

      #toast {
        position: fixed;

        top: max(18px, env(safe-area-inset-top));

        left: 50%;

        max-width: calc(100vw - 40px);

        transform: translateX(-50%) translateY(-20px);

        opacity: 0;

        transition:
          opacity 0.35s ease,
          transform 0.35s ease;

        padding: 10px 16px;

        border-radius: 999px;

        background: rgba(0, 0, 0, 0.55);

        backdrop-filter: blur(10px);

        -webkit-backdrop-filter: blur(10px);

        font-size: 13px;

        pointer-events: none;

        white-space: nowrap;

        overflow: hidden;

        text-overflow: ellipsis;

        z-index: 10;
      }

      #toast.show {
        opacity: 1;

        transform: translateX(-50%) translateY(0);
      }

      /* =========================================================
   TABLET / SMALL LAPTOP
========================================================= */

      @media (max-width: 900px) {
        .timerBox {
          width: min(94vw, 600px);
        }

        .ring {
          width: min(64vw, 64vh, 380px);
        }

        .time {
          font-size: min(15vw, 15vh, 90px);
        }
      }

      /* =========================================================
   MOBILE PORTRAIT
========================================================= */

      @media (max-width: 600px) and (orientation: portrait) {
        .wrap {
          padding: max(14px, env(safe-area-inset-top))
            max(14px, env(safe-area-inset-right))
            max(14px, env(safe-area-inset-bottom))
            max(14px, env(safe-area-inset-left));
        }

        .timerBox {
          width: 94vw;
        }

        .ring {
          width: min(72vw, 55vh, 330px);
        }

        .timerContent {
          width: 80%;
        }

        .time {
          font-size: min(15vw, 12.5vh, 76px);

          letter-spacing: 0.5px;
        }

        .mode {
          margin-top: 7px;

          font-size: min(3vw, 2vh, 13px);

          letter-spacing: 3px;
        }

        .musicInfo {
          width: min(78vw, 300px);

          margin-top: 9px;

          font-size: 11px;
        }

        .controls {
          width: 96%;

          margin-top: 10px;

          gap: 6px;
        }

        button {
          padding: 7px 13px;

          font-size: 12px;

          min-height: 34px;
        }

        .badge {
          top: max(10px, env(safe-area-inset-top));

          left: max(10px, env(safe-area-inset-left));

          padding: 6px 9px;

          font-size: 11px;
        }

        .fullscreenBtn {
          top: max(10px, env(safe-area-inset-top));

          right: max(10px, env(safe-area-inset-right));

          width: 36px;
          height: 36px;

          font-size: 19px;
        }

        #toast {
          top: max(10px, env(safe-area-inset-top));

          max-width: calc(100vw - 28px);

          padding: 8px 13px;

          font-size: 12px;
        }
      }

      /* =========================================================
   VERY SMALL MOBILE
========================================================= */

      @media (max-width: 380px) and (orientation: portrait) {
        .wrap {
          padding: 10px;
        }

        .ring {
          width: min(70vw, 50vh, 270px);
        }

        .timerContent {
          width: 78%;
        }

        .time {
          font-size: min(14vw, 11vh, 62px);
        }

        .mode {
          margin-top: 5px;

          font-size: 10px;

          letter-spacing: 2.5px;
        }

        .musicInfo {
          margin-top: 7px;

          font-size: 10px;
        }

        .controls {
          margin-top: 7px;

          gap: 5px;
        }

        button {
          min-height: 31px;

          padding: 6px 11px;

          font-size: 11px;
        }
      }

      /* =========================================================
   MOBILE LANDSCAPE
========================================================= */

      @media (max-width: 900px) and (orientation: landscape) {
        .wrap {
          padding: 10px 16px;
        }

        .timerBox {
          width: 94vw;
        }

        .ring {
          width: min(42vh, 42vw, 300px);
        }

        .timerContent {
          width: 80%;
        }

        .time {
          font-size: min(11vh, 11vw, 70px);
        }

        .mode {
          margin-top: 5px;

          font-size: min(2.4vh, 2.4vw, 12px);

          letter-spacing: 2.5px;
        }

        .musicInfo {
          margin-top: 6px;

          font-size: min(2.2vh, 2.2vw, 11px);
        }

        .controls {
          margin-top: 8px;

          gap: 5px;
        }

        button {
          min-height: 30px;

          padding: 6px 12px;

          font-size: min(2.2vh, 2.2vw, 11px);
        }

        .badge {
          top: 8px;
          left: 8px;

          padding: 5px 8px;

          font-size: 10px;
        }

        .fullscreenBtn {
          top: 8px;
          right: 8px;

          width: 34px;
          height: 34px;

          font-size: 18px;
        }

        #toast {
          top: 8px;

          padding: 7px 12px;

          font-size: 11px;
        }
      }

      /* =========================================================
   EXTREMELY SHORT SCREEN
========================================================= */

      @media (max-height: 500px) {
        .ring {
          width: min(43vh, 60vw, 280px);
        }

        .time {
          font-size: min(11vh, 14vw, 68px);
        }

        .musicInfo {
          margin-top: 5px;
        }

        .controls {
          margin-top: 6px;
        }
      }

      /* =========================================================
   LARGE SCREEN
========================================================= */

      @media (min-width: 1400px) and (min-height: 800px) {
        .ring {
          width: min(52vh, 430px);
        }

        .time {
          font-size: min(12vh, 104px);
        }
      }
    </style>
  </head>

  <body>
    <!-- =======================================================
     BACKGROUND
======================================================== -->

    <img id="bg" alt="" />

    <div id="shade"></div>

    <!-- =======================================================
     ROUND
======================================================== -->

    <div class="badge" id="session">ROUND 1</div>

    <!-- =======================================================
     FULLSCREEN
======================================================== -->

    <button
      class="fullscreenBtn"
      id="fullscreenBtn"
      aria-label="전체 화면"
      title="전체 화면"
    >
      ⛶
    </button>

    <!-- =======================================================
     TOAST
======================================================== -->

    <div id="toast"></div>

    <!-- =======================================================
     YOUTUBE PLAYER
======================================================== -->

    <div id="youtubePlayer"></div>

    <!-- =======================================================
     MAIN
======================================================== -->

    <div class="wrap">
      <main class="timerBox">
        ```
        <!-- =================================================
     TIMER
================================================== -->

        <div class="ring">
          <svg viewBox="0 0 200 200" aria-hidden="true">
            <circle class="track" cx="100" cy="100" r="92"></circle>

            <circle
              class="progress"
              id="progress"
              cx="100"
              cy="100"
              r="92"
            ></circle>
          </svg>

          <div class="timerContent">
            <div class="time" id="time">25:00</div>

            <div class="mode" id="mode">집중</div>
          </div>
        </div>

        <!-- =================================================
     MUSIC TITLE
================================================== -->

        <div class="musicInfo" id="musicInfo">
          <span class="musicIcon"> ♫ </span>

          <span id="musicTitle"> 음악 준비 중... </span>
        </div>

        <!-- =================================================
     CONTROLS
================================================== -->

        <div class="controls">
          <button id="start">▶ 시작</button>

          <button id="pause">Ⅱ 일시정지</button>

          <button id="skip">다음 단계 →</button>

          <button id="reset">↻ 처음부터</button>
        </div>
        ```
      </main>
    </div>

    <script>
      /* =========================================================
   FIXED YOUTUBE PLAYLIST
========================================================= */

      const PLAYLIST_ID = "PLYPZ0oNM1h6E";

      /* =========================================================
   BACKGROUNDS
========================================================= */

      const BUILTIN = [
        "backgrounds/bg1.jpg",

        "backgrounds/bg2.jpg",

        "backgrounds/bg3.jpg",
      ];

      let backgrounds = [...BUILTIN];

      let currentBg = -1;

      /* =========================================================
   ELEMENTS
========================================================= */

      const bg = document.getElementById("bg");

      const timeEl = document.getElementById("time");

      const modeEl = document.getElementById("mode");

      const progress = document.getElementById("progress");

      const sessionEl = document.getElementById("session");

      const toast = document.getElementById("toast");

      const musicTitleEl = document.getElementById("musicTitle");

      /* =========================================================
   TIMER CIRCLE
========================================================= */

      const R = 92;

      const C = 2 * Math.PI * R;

      progress.style.strokeDasharray = `0 ${C}`;

      progress.style.strokeDashoffset = 0;

      /* =========================================================
   TIMER STATE
========================================================= */

      let phase = "focus";

      let duration = 25 * 60;

      let remaining = duration;

      let running = false;

      let lastTick = null;

      let round = 1;

      let timerId = null;

      /* =========================================================
   AUDIO
========================================================= */

      let audioCtx = null;

      /* =========================================================
   YOUTUBE
========================================================= */

      let ytPlayer = null;

      let youtubeReady = false;

      /* =========================================================
   MUSIC TITLE
========================================================= */

      function setMusicTitle(title) {
        if (!title) {
          musicTitleEl.textContent = "음악 준비 중...";

          return;
        }

        musicTitleEl.textContent = title;
      }

      /* =========================================================
   YOUTUBE API READY
========================================================= */

      function onYouTubeIframeAPIReady() {
        ytPlayer = new YT.Player("youtubePlayer", {
          width: "1",

          height: "1",

          playerVars: {
            autoplay: 0,

            controls: 0,

            rel: 0,

            modestbranding: 1,

            playsinline: 1,
          },

          events: {
            onReady: function () {
              youtubeReady = true;

              loadPlaylist();
            },

            onStateChange: function (event) {
              handleYoutubeState(event);
            },

            onError: function (event) {
              console.warn("YouTube 오류:", event.data);

              setMusicTitle("음악을 재생할 수 없습니다");
            },
          },
        });
      }

      window.onYouTubeIframeAPIReady = onYouTubeIframeAPIReady;

      /* =========================================================
   LOAD PLAYLIST
========================================================= */

      function loadPlaylist() {
        if (!youtubeReady || !ytPlayer) {
          return;
        }

        try {
          ytPlayer.cuePlaylist({
            listType: "playlist",

            list: PLAYLIST_ID,

            index: 0,

            startSeconds: 0,
          });

          setMusicTitle("음악 준비 완료");
        } catch (e) {
          console.error("플레이리스트 로드 실패:", e);
        }
      }

      /* =========================================================
   YOUTUBE STATE
========================================================= */

      function handleYoutubeState(event) {
        if (!window.YT || !YT.PlayerState) {
          return;
        }

        if (event.data === YT.PlayerState.PLAYING) {
          updateCurrentVideoTitle();

          setTimeout(updateCurrentVideoTitle, 300);

          setTimeout(updateCurrentVideoTitle, 1000);
        }

        if (event.data === YT.PlayerState.ENDED) {
          setTimeout(updateCurrentVideoTitle, 500);
        }
      }

      /* =========================================================
   CURRENT SONG TITLE
========================================================= */

      function updateCurrentVideoTitle() {
        if (!ytPlayer || !youtubeReady) {
          return;
        }

        try {
          const data = ytPlayer.getVideoData();

          if (data && data.title) {
            setMusicTitle(data.title);
          }
        } catch (e) {
          console.warn("노래 제목을 가져올 수 없습니다:", e);
        }
      }

      /* =========================================================
   PLAY MUSIC
========================================================= */

      function playMusic() {
        if (!youtubeReady || !ytPlayer) {
          setMusicTitle("음악 준비 중...");

          return;
        }

        try {
          ytPlayer.playVideo();

          setTimeout(updateCurrentVideoTitle, 300);

          setTimeout(updateCurrentVideoTitle, 1000);
        } catch (e) {
          console.warn("YouTube 재생 실패:", e);
        }
      }

      /* =========================================================
   PAUSE MUSIC
========================================================= */

      function pauseMusic() {
        if (!youtubeReady || !ytPlayer) {
          return;
        }

        try {
          ytPlayer.pauseVideo();
        } catch (e) {
          console.warn("YouTube 일시정지 실패:", e);
        }
      }

      /* =========================================================
   RESET MUSIC
========================================================= */

      function resetMusic() {
        if (!youtubeReady || !ytPlayer) {
          return;
        }

        try {
          ytPlayer.stopVideo();

          ytPlayer.cuePlaylist({
            listType: "playlist",

            list: PLAYLIST_ID,

            index: 0,

            startSeconds: 0,
          });

          setMusicTitle("음악 대기 중");
        } catch (e) {
          console.warn("YouTube 초기화 실패:", e);
        }
      }

      /* =========================================================
   BACKGROUND PICKER
========================================================= */

      function pickBackground() {
        if (backgrounds.length === 0) {
          return;
        }

        let next;

        do {
          next = Math.floor(Math.random() * backgrounds.length);
        } while (backgrounds.length > 1 && next === currentBg);

        currentBg = next;

        bg.style.opacity = 0;

        setTimeout(() => {
          bg.src = backgrounds[currentBg];

          bg.style.opacity = 1;
        }, 180);
      }

      pickBackground();

      /* =========================================================
   FORMAT TIME
========================================================= */

      function format(sec) {
        sec = Math.max(0, Math.ceil(sec));

        const minutes = Math.floor(sec / 60);

        const seconds = sec % 60;

        return (
          String(minutes).padStart(2, "0") +
          ":" +
          String(seconds).padStart(2, "0")
        );
      }

      /* =========================================================
   RENDER
========================================================= */

      function render() {
        timeEl.textContent = format(remaining);

        modeEl.textContent = phase === "focus" ? "집중" : "휴식";

        sessionEl.textContent = `ROUND ${round}`;

        const ratio = Math.max(
          0,
          Math.min(1, (duration - remaining) / duration),
        );

        progress.style.strokeDasharray = `${C * ratio} ${C}`;

        progress.style.strokeDashoffset = 0;

        document.title = `${format(remaining)} · ${
          phase === "focus" ? "집중" : "휴식"
        }`;
      }

      /* =========================================================
   TOAST
========================================================= */

      function showToast(msg) {
        toast.textContent = msg;

        toast.classList.add("show");

        clearTimeout(showToast.t);

        showToast.t = setTimeout(() => {
          toast.classList.remove("show");
        }, 2200);
      }

      /* =========================================================
   SOUNDS
========================================================= */

      const sounds = {
        focusStart: new Audio("sounds/focus-start.wav"),

        focusEnd: new Audio("sounds/focus-end.wav"),

        breakStart: new Audio("sounds/break-start.wav"),

        breakEnd: new Audio("sounds/break-end.wav"),

        pause: new Audio("sounds/pause.wav"),
      };

      Object.values(sounds).forEach((audio) => {
        audio.preload = "auto";

        audio.volume = 1.0;
      });

      /* =========================================================
   SOUND
========================================================= */

      function beep(kind) {
        try {
          const audio = sounds[kind] || sounds.focusStart;

          audio.currentTime = 0;

          const promise = audio.play();

          if (promise) {
            promise.catch((e) => {
              console.warn("알림음 재생 실패:", e);
            });
          }
        } catch (e) {
          console.warn("알림음 재생 실패:", e);
        }
      }

      /* =========================================================
   START
========================================================= */

      function start() {
        if (running) {
          return;
        }

        try {
          audioCtx =
            audioCtx ||
            new (window.AudioContext || window.webkitAudioContext)();

          if (audioCtx.state === "suspended") {
            audioCtx.resume();
          }
        } catch (e) {}

        running = true;

        lastTick = performance.now();

        beep(phase === "focus" ? "focusStart" : "breakStart");

        if (phase === "focus") {
          playMusic();

          showToast("집중 시작 🍅 🎵");
        } else {
          pauseMusic();

          setMusicTitle("휴식 중 ☕");

          showToast("휴식 시작 ☕");
        }

        timerId = requestAnimationFrame(tick);
      }

      /* =========================================================
   TICK
========================================================= */

      function tick(now) {
        if (!running) {
          return;
        }

        const delta = (now - lastTick) / 1000;

        lastTick = now;

        remaining -= delta;

        if (remaining <= 0) {
          remaining = 0;

          render();

          transition();

          return;
        }

        render();

        timerId = requestAnimationFrame(tick);
      }

      /* =========================================================
   PAUSE
========================================================= */

      function pause() {
        if (!running) {
          return;
        }

        running = false;

        cancelAnimationFrame(timerId);

        pauseMusic();

        beep("pause");

        showToast("일시정지");
      }

      /* =========================================================
   PHASE TRANSITION
========================================================= */

      function transition() {
        running = false;

        cancelAnimationFrame(timerId);

        if (phase === "focus") {
          beep("focusEnd");

          pauseMusic();

          phase = "break";

          duration = 5 * 60;

          remaining = duration;

          setMusicTitle("휴식 중 ☕");

          showToast("집중 끝! 5분 휴식 🌿");
        } else {
          beep("breakEnd");

          phase = "focus";

          duration = 25 * 60;

          remaining = duration;

          round++;

          pickBackground();

          showToast("휴식 끝! 다시 집중 🍅 🎵");
        }

        render();

        /*
    다음 단계는 자동으로 시작
  */

        start();
      }

      /* =========================================================
   SKIP
========================================================= */

      function skip() {
        transition();
      }

      /* =========================================================
   RESET
========================================================= */

      function reset() {
        running = false;

        cancelAnimationFrame(timerId);

        phase = "focus";

        duration = 25 * 60;

        remaining = duration;

        round = 1;

        pauseMusic();

        resetMusic();

        pickBackground();

        render();

        showToast("처음부터 시작");
      }

      /* =========================================================
   FULLSCREEN
========================================================= */

      const fullscreenBtn = document.getElementById("fullscreenBtn");

      function updateFullscreenButton() {
        if (document.fullscreenElement) {
          fullscreenBtn.textContent = "⛶";

          fullscreenBtn.title = "전체 화면 종료";

          fullscreenBtn.setAttribute("aria-label", "전체 화면 종료");
        } else {
          fullscreenBtn.textContent = "⛶";

          fullscreenBtn.title = "전체 화면";

          fullscreenBtn.setAttribute("aria-label", "전체 화면");
        }
      }

      async function toggleFullscreen() {
        try {
          if (!document.fullscreenElement) {
            await document.documentElement.requestFullscreen();
          } else {
            await document.exitFullscreen();
          }
        } catch (error) {
          console.warn("전체 화면 전환 실패:", error);

          showToast("이 브라우저에서는 전체 화면을 사용할 수 없습니다.");
        }
      }

      fullscreenBtn.addEventListener("click", toggleFullscreen);

      document.addEventListener("fullscreenchange", updateFullscreenButton);

      /* =========================================================
   BUTTON EVENTS
========================================================= */

      document.getElementById("start").addEventListener("click", start);

      document.getElementById("pause").addEventListener("click", pause);

      document.getElementById("skip").addEventListener("click", skip);

      document.getElementById("reset").addEventListener("click", reset);

      /* =========================================================
   INITIAL
========================================================= */

      render();

      setMusicTitle("음악 준비 중...");

      updateFullscreenButton();
    </script>
  </body>
</html>
